<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0c1020" />
    </linearGradient>

    <!-- Text Gradient - Neon Cyan to Purple/Pink -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#9b5de5" />
      <stop offset="100%" stop-color="#f15bb5" />
    </linearGradient>

    <!-- Node Glow Gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Purple Glow -->
    <radialGradient id="purpleGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7b2cbf" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Cyan Glow -->
    <radialGradient id="cyanGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter for Nodes -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Outfit', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 54px;
      letter-spacing: 3px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Outfit', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 4px;
      fill: #a0aec0;
      text-transform: uppercase;
    }
    .tagline {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #06d6a0;
    }
    .network-node {
      fill: #00F2FE;
      filter: url(#glowFilter);
      animation: pulse 3s infinite alternate;
    }
    .network-link {
      stroke: #00F2FE;
      stroke-width: 0.8;
      stroke-opacity: 0.15;
      stroke-dasharray: 4 2;
    }
    .grid-line {
      stroke: #ffffff;
      stroke-opacity: 0.02;
      stroke-width: 1;
    }
  </style>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bgGrad)" />

  <!-- Ambient Light Effects -->
  <circle cx="720" cy="96" r="300" fill="url(#purpleGlow)" />
  <circle cx="180" cy="256" r="250" fill="url(#cyanGlow)" />

  <!-- Grid Background (Representing Space/Data) -->
  <g>
    <!-- Horizontal grid lines -->
    <line x1="0" y1="40" x2="900" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="900" y2="80" class="grid-line" />
    <line x1="0" y1="120" x2="900" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="900" y2="160" class="grid-line" />
    <line x1="0" y1="200" x2="900" y2="200" class="grid-line" />
    <line x1="0" y1="240" x2="900" y2="240" class="grid-line" />
    <line x1="0" y1="280" x2="900" y2="280" class="grid-line" />

    <!-- Vertical grid lines -->
    <line x1="100" y1="0" x2="100" y2="320" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="320" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="320" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="320" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="320" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="320" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="320" class="grid-line" />
  </g>

  <!-- Abstract Tech/Data visualization (Neural Network) on the right side -->
  <g id="neural-net">
    <!-- Connections -->
    <line x1="650" y1="160" x2="720" y2="100" class="network-link" stroke-dasharray="none" />
    <line x1="650" y1="160" x2="720" y2="220" class="network-link" stroke-dasharray="none" />
    <line x1="720" y1="100" x2="800" y2="80" class="network-link" stroke-dasharray="none" />
    <line x1="720" y1="100" x2="800" y2="150" class="network-link" stroke-dasharray="none" />
    <line x1="720" y1="220" x2="800" y2="150" class="network-link" stroke-dasharray="none" />
    <line x1="720" y1="220" x2="800" y2="240" class="network-link" stroke-dasharray="none" />
    
    <line x1="800" y1="80" x2="860" y2="160" class="network-link" stroke-dasharray="none" />
    <line x1="800" y1="150" x2="860" y2="160" class="network-link" stroke-dasharray="none" />
    <line x1="800" y1="240" x2="860" y2="160" class="network-link" stroke-dasharray="none" />

    <!-- Extra faint background nodes -->
    <circle cx="680" cy="70" r="2" fill="#9b5de5" opacity="0.4" />
    <circle cx="620" cy="230" r="3" fill="#00F2FE" opacity="0.3" />
    <circle cx="750" cy="270" r="2" fill="#f15bb5" opacity="0.4" />
    <line x1="620" y1="230" x2="650" y2="160" class="network-link" opacity="0.08" />

    <!-- Active Nodes (with glows) -->
    <circle cx="650" cy="160" r="6" fill="#00F2FE" class="network-node" />
    <circle cx="720" cy="100" r="8" fill="#9b5de5" class="network-node" style="fill: #9b5de5;" />
    <circle cx="720" cy="220" r="8" fill="#f15bb5" class="network-node" style="fill: #f15bb5;" />
    <circle cx="800" cy="80" r="5" fill="#00F2FE" class="network-node" />
    <circle cx="800" cy="150" r="5" fill="#9b5de5" class="network-node" style="fill: #9b5de5;" />
    <circle cx="800" cy="240" r="5" fill="#f15bb5" class="network-node" style="fill: #f15bb5;" />
    <circle cx="860" cy="160" r="9" fill="#06d6a0" class="network-node" style="fill: #06d6a0;" />
  </g>

  <!-- Left/Center Content -->
  <g transform="translate(60, 0)">
    <!-- Decorative brackets/code tags -->
    <text x="-15" y="90" font-family="Courier New, monospace" font-size="28" fill="#00F2FE" opacity="0.3">&lt;</text>
    <text x="-15" y="250" font-family="Courier New, monospace" font-size="28" fill="#f15bb5" opacity="0.3">&sol;&gt;</text>

    <!-- Name -->
    <text x="15" y="115" class="title">PRERAN RAI</text>

    <!-- Professional Role -->
    <text x="18" y="165" class="subtitle">Artificial Intelligence &amp; ML Engineer</text>

    <!-- Divider Line -->
    <line x1="18" y1="190" x2="480" y2="190" stroke="#f15bb5" stroke-width="2" opacity="0.8" stroke-linecap="round" />

    <!-- Tagline / Skills bullets -->
    <g transform="translate(18, 222)">
      <!-- Bullet 1 -->
      <circle cx="5" cy="-5" r="3.5" fill="#00F2FE" />
      <text x="18" y="0" class="tagline">BUILDING AI SOLUTIONS</text>

      <!-- Bullet 2 -->
      <circle cx="235" cy="-5" r="3.5" fill="#9b5de5" />
      <text x="248" y="0" class="tagline">RESEARCH ENTHUSIAST</text>

      <!-- Bullet 3 -->
      <circle cx="475" cy="-5" r="3.5" fill="#f15bb5" />
      <text x="488" y="0" class="tagline">OPEN SOURCE CONTRIBUTOR</text>
    </g>
  </g>
</svg>
